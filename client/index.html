<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MayerfeldBooks, an independent bookstore with fiction, nonfiction, staff picks, readings and book clubs." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap"
    />
    <script>
      // Turn dark mode on before the page is drawn, so it doesn't flash light
      // first: the visitor's saved choice, else their computer's setting.
      try {
        const saved = localStorage.getItem('theme')
        const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.classList.add('dark')
        }
      } catch {
        // localStorage can be blocked; then we simply start light
      }
    </script>
    <title>MayerfeldBooks | Independent Bookstore</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
